# Database MCP Toolbox Configuration
# Enforces strict read-only access to BigQuery telemetry data
sources:
  bigquery-source:
    kind: "bigquery"
    project: "your-demo-project"
    location: "us-central1"
    maxQueryResultRows: 100

tools:
  describe_table:
    kind: bigquery-get-table-info
    source: bigquery-source
    description: "Inspects schema, column definitions, and partition details for telemetry tables."

  list_tables:
    kind: bigquery-list-table-ids
    source: bigquery-source
    description: "Lists all approved tables in the telemetry dataset."

  list_datasets:
    kind: bigquery-list-dataset-ids
    source: bigquery-source
    description: "Lists datasets in the target project."

  execute_sql:
    kind: bigquery-execute-sql
    source: bigquery-source
    description: "Executes read-only SQL queries. Strictly disallows DDL (DROP, CREATE, ALTER) and DML (INSERT, UPDATE, DELETE)."
